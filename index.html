<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>顺星ISO系统</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","微软雅黑",sans-serif;background:#f0f2f5;min-height:100vh;display:flex;flex-direction:column;margin:0}

/* ═══════ 登录页 ═══════ */
.login-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#0f172a 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .6s,visibility .6s}
.login-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
.login-box{background:rgba(255,255,255,.06);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:48px 44px 36px;text-align:center;width:400px;box-shadow:0 25px 60px rgba(0,0,0,.4)}
.login-logo-wrap{margin-bottom:24px}
.login-title{color:#fff;font-size:22px;font-weight:700;margin-bottom:4px;letter-spacing:3px}
.login-subtitle{color:rgba(255,255,255,.45);font-size:12px;margin-bottom:36px;letter-spacing:1px}
.login-input{width:100%;padding:14px 20px;border:1px solid rgba(255,255,255,.15);border-radius:12px;background:rgba(255,255,255,.05);color:#fff;font-size:16px;text-align:center;letter-spacing:6px;outline:none;transition:all .3s}
.login-input::placeholder{color:rgba(255,255,255,.25);letter-spacing:1px;font-size:13px}
.login-input:focus{border-color:rgba(102,126,234,.6);background:rgba(255,255,255,.08);box-shadow:0 0 24px rgba(102,126,234,.15)}
.login-btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:18px;transition:all .3s;letter-spacing:3px}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(102,126,234,.35)}
.login-btn:active{transform:translateY(0)}
.login-error{color:#ff6b6b;font-size:12px;margin-top:14px;min-height:18px;transition:opacity .3s}
.login-footer{color:rgba(255,255,255,.3);font-size:11px;margin-top:48px;text-align:center;line-height:1.8}
.login-footer .co-name{color:rgba(255,255,255,.5);font-weight:500}

/* ═══════ 主应用 ═══════ */
.app-wrap{display:none;flex-direction:column;min-height:100vh}
.app-wrap.active{display:flex}
.app-bg{background:#f0f2f5;flex:1;padding:28px 20px 16px}
.container{max-width:960px;margin:0 auto}

/* 头部 - 固定顶部 */
.app-header{position:sticky;top:0;background:#f0f2f5;z-index:100;padding:12px 0 16px;text-align:center}
.back-btn{position:absolute;left:20px;top:50%;transform:translateY(-50%);background:none;border:1px solid #ddd;border-radius:8px;padding:6px 14px;font-size:13px;color:#666;cursor:pointer;transition:all .2s}
.back-btn:hover{background:#667eea;color:#fff;border-color:#667eea}
.app-header h1{font-size:26px;font-weight:800;letter-spacing:4px}
.app-header h1 .logo-icon{display:inline-block;width:32px;height:32px;vertical-align:middle;margin-right:8px;margin-top:-3px}
.app-header .sub{color:#999;font-size:12px;margin-top:4px;letter-spacing:1px}

/* 卡片 */
.card{background:#fff;border-radius:14px;padding:24px 28px;margin-bottom:16px;box-shadow:0 1px 8px rgba(0,0,0,.05);border:1px solid rgba(0,0,0,.04)}
.card h2{font-size:15px;color:#333;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid #f0f0f0;display:flex;align-items:center;gap:8px;font-weight:600}
.step-num{width:26px;height:26px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}

/* 上传 */
.upload-area{border:2px dashed #d8dae0;border-radius:12px;padding:40px;text-align:center;cursor:pointer;transition:all .3s;background:#fafbfc}
.upload-area:hover,.upload-area.dragover{border-color:#667eea;background:#f5f7ff}
.upload-icon{font-size:44px;margin-bottom:10px;opacity:.85}
.upload-area p{color:#666;font-size:13px;margin-bottom:4px}
.hint{color:#bbb;font-size:11px}
#excel-input{display:none}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 26px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .25s;letter-spacing:1px}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;box-shadow:0 4px 16px rgba(102,126,234,.25)}.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(102,126,234,.35)}.btn-primary:disabled{background:#ccc;box-shadow:none;cursor:not-allowed;transform:none}
.btn-success{background:linear-gradient(135deg,#43a047,#66bb6a);color:#fff;box-shadow:0 4px 16px rgba(67,160,71,.25)}.btn-success:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(67,160,71,.35)}
.action-bar{display:flex;gap:12px;justify-content:flex-end;margin-top:14px}

/* 状态 */
.file-info-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(135deg,#e8f5e9,#f1f8e9);border-radius:10px;margin-bottom:14px;font-size:13px;color:#2e7d32;border-left:4px solid #43a047}
.change-btn{cursor:pointer;color:#667eea;font-size:12px;text-decoration:none;margin-left:auto;font-weight:500}
.change-btn:hover{text-decoration:underline}
.progress-bar{height:4px;background:#e8e8e8;border-radius:2px;overflow:hidden;margin-top:10px}
.progress-fill{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);border-radius:2px;transition:width .3s;width:0%}
#status-area{padding:10px 14px;border-radius:10px;font-size:13px;margin-top:10px;display:none}
.status-info{background:#e3f2fd;color:#1565c0;border-left:4px solid #2196f3}
.status-success{background:#e8f5e9;color:#2e7d32;border-left:4px solid #43a047}
.status-err{background:#ffebee;color:#c62828;border-left:4px solid #e53935}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* 表格 */
table.data-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}
table.data-table th{background:#f8f9fa;padding:8px 10px;text-align:left;border:1px solid #eee;font-weight:600;white-space:nowrap;color:#555}
table.data-table td{padding:6px 10px;border:1px solid #f0f0f0;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.data-table tr:hover{background:#f8f9ff}

/* 配置 */
.config-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.config-item{display:flex;align-items:center;gap:6px;font-size:13px}
.config-item label{color:#666;min-width:90px;font-weight:500}
.config-item input{padding:7px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;width:180px;transition:all .2s}
.config-item input:focus{border-color:#667eea;outline:none;box-shadow:0 0 0 3px rgba(102,126,234,.1)}
.config-item.wide input{width:140px}

/* 供应商列表 */
.company-list{display:flex;flex-direction:column;gap:8px}
.company-item{border:1px solid #eee;border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:12px;background:#fafbfc;transition:all .2s}
.company-item:hover{border-color:#667eea;background:#fff;box-shadow:0 2px 8px rgba(102,126,234,.08)}
.company-name{font-size:14px;font-weight:600;color:#222;margin-bottom:2px}
.page-info{font-size:12px;color:#999}
.status-badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:500;flex-shrink:0}
.status-pending{background:#fff8e1;color:#f57f17}
.status-done{background:#e8f5e9;color:#2e7d32}
.status-error{background:#ffebee;color:#c62828}
.seal-preview-wrap{display:flex;flex-direction:column;align-items:center;gap:3px}

/* 功能选择页 */
.feature-grid{display:flex;gap:20px;justify-content:center;padding:32px 0}
.feature-card{background:#fff;border-radius:16px;padding:36px 32px;text-align:center;cursor:pointer;transition:all .3s;box-shadow:0 2px 12px rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.04);width:220px;text-decoration:none;color:inherit}
.feature-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(102,126,234,.18);border-color:#667eea}
.feature-icon{font-size:48px;margin-bottom:14px;display:block}
.feature-name{font-size:16px;font-weight:700;color:#222;margin-bottom:6px}
.feature-desc{font-size:12px;color:#999;line-height:1.5}
.home-title{text-align:center;font-size:20px;font-weight:700;color:#333;padding:24px 0 4px;letter-spacing:2px}
</style>
</head>
<body>
<!-- ═══════ 登录页 ═══════ -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="login-logo-wrap">
      <img src="sx_logo.jpg" width="72" height="72" style="border-radius:8px;object-fit:contain" alt="顺星logo">
    </div>
    <div class="login-title">顺星ISO系统</div>
    <div class="login-subtitle">宁波顺星企业服务有限公司</div>
    <input type="password" class="login-input" id="loginPwd" placeholder="请输入系统密码" autocomplete="off">
    <button class="login-btn" onclick="doLogin()">进 入 系 统</button>
    <div class="login-error" id="loginErr"></div>
  </div>
  <div class="login-footer">© 版权归 <span class="co-name">宁波顺星企业服务有限公司</span> 所有</div>
</div>

<!-- ═══════ 主应用 ═══════ -->
<div class="app-wrap" id="appWrap">
<div class="app-bg">
<div class="container">
  <div class="app-header">
    <h1>顺星ISO系统</h1>
    <div class="sub">宁波顺星企业服务有限公司</div>
    <button class="back-btn" id="backBtn" style="display:none" onclick="showHome()">← 返回首页</button>
  </div>

  <!-- ═════ 功能选择主页 ═════ -->
  <div id="home-page">
    <div class="home-title">请选择功能</div>
    <div class="feature-grid">
      <a class="feature-card" onclick="showWorkflow()">
        <span class="feature-icon">📋</span>
        <div class="feature-name">供应商填写</div>
        <div class="feature-desc">选择供应商<br>自动生成质量协议并盖章</div>
      </a>
      <!-- 后续可在此添加更多功能卡片 -->
    </div>
  </div>

  <!-- ═════ 供应商填写工作流（默认隐藏） ═════ -->
  <div id="workflow-page" style="display:none">
  <div class="card">
    <h2><span class="step-num">1</span> 上传Excel供应商数据</h2>
    <div id="excel-info" class="file-info-bar" style="display:none">
      <span>📊</span><span id="excel-name" style="font-weight:600;flex:1"></span>
      <span class="change-btn" onclick="resetExcel()">更换文件</span>
    </div>
    <div class="upload-area" id="excel-upload" onclick="document.getElementById('excel-input').click()"
      ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')"
      ondrop="event.preventDefault();this.classList.remove('dragover');handleExcelDrop(event)">
      <div class="upload-icon">📊</div>
      <p>点击选择 Excel 供应商数据文件</p>
      <p class="hint">支持 .xlsx 格式</p>
    </div>
    <input type="file" id="excel-input" accept=".xlsx,.xls" onchange="handleExcelFile(this.files[0])">
    <div id="status-area"></div>
    <div class="progress-bar" id="progress-bar" style="display:none"><div class="progress-fill" id="progress-fill"></div></div>
  </div>

  <div class="card" id="data-card" style="display:none">
    <h2><span class="step-num">2</span> 配置& （开始偷懒啦）</h2>
    <div class="config-row">
      <div class="config-item"><label>顺星服务客户：</label><input id="cfg-partyA" value="宁海县中林橡塑有限公司"></div>
      <div class="config-item"><label>编号前缀：</label><input id="cfg-prefix" value="ZL-QF-0904"></div>
      <div class="config-item"><label>版本号：</label><input id="cfg-version" value="A/0"></div>
    </div>
    <div class="config-row">
      <div class="config-item wide"><label>业务部：</label><input id="cfg-r1" value="董晓燕"></div>
      <div class="config-item wide"><label>质量部：</label><input id="cfg-r2" value="舒玛莉"></div>
      <div class="config-item wide"><label>采购部：</label><input id="cfg-r3" value="王明"></div>
      <div class="config-item wide"><label>技术部：</label><input id="cfg-r4" value="罗胜绪"></div>
      <div class="config-item wide"><label>总经理：</label><input id="cfg-manager" value="贺永"></div>
    </div>
    <div id="data-preview"></div>
  </div>

  <div class="card" id="gen-card" style="display:none">
    <h2><span class="step-num">3</span> 生成并盖章</h2>
    <div id="gen-summary" style="font-size:13px;color:#666;margin-bottom:12px"></div>
    <div id="company-list-preview"></div>
    <div class="action-bar">
      <button class="btn btn-primary" id="gen-btn" onclick="generateAll()">
        <span id="gen-spinner" class="spinner" style="display:none"></span>
        🖊 开始生成
      </button>
    </div>
  </div>

  <div class="card" id="export-card" style="display:none">
    <h2><span class="step-num">4</span> 下载</h2>
    <div id="export-list"></div>
    <div class="action-bar">
      <button class="btn btn-success" onclick="downloadAll()">📥 下载文档</button>
    </div>
  </div>
</div>
</div>
<div class="app-footer">© 版权归 <span class="co">宁波顺星企业服务有限公司</span> 所有</div>
</div>

function handleExcelDrop(e){if(e.dataTransfer.files.length)handleExcelFile(e.dataTransfer.files[0])}
function handleExcelFile(file){
  if(!file)return;excelFile=file;
  document.getElementById('excel-upload').style.display='none';
  document.getElementById('excel-info').style.display='flex';
  document.getElementById('excel-name').textContent=file.name;
  parseExcel(file);
}
function resetExcel(){
  excelFile=null;suppliers=[];generatedFiles=[];
  document.getElementById('excel-upload').style.display='block';
  document.getElementById('excel-info').style.display='none';
  document.getElementById('data-card').style.display='none';
  document.getElementById('gen-card').style.display='none';
  document.getElementById('export-card').style.display='none';
  document.getElementById('excel-input').value='';
}
function parseExcel(file){
  showStatus('正在解析Excel...','info');
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const data=XLSX.utils.sheet_to_json(ws,{header:1});
      let headerRow=1;
      for(let i=0;i<data.length;i++){if(data[i]&&data[i].some(c=>String(c).includes('供应商公司名称'))){headerRow=i;break}}
      suppliers=[];
      for(let i=headerRow+1;i<data.length;i++){
        const row=data[i];if(!row||!row[1])continue;
        const cn=String(row[1]||'').trim();if(!cn||cn.length<4)continue;
        suppliers.push({companyName:cn,contact:String(row[2]||'').trim(),position:String(row[3]||'').trim(),phone:String(row[4]||'').trim(),address:String(row[5]||'').trim(),material:String(row[6]||'').trim(),date:row[7]?fmtDate(row[7]):''});
      }
      if(!suppliers.length){showStatus('未找到供应商数据','err');return}
      showStatus('✅ 解析到 '+suppliers.length+' 家供应商','success');
      renderPreview();
    }catch(err){showStatus('❌ '+err.message,'err')}
  };
  reader.readAsArrayBuffer(file);
}
function fmtDate(d){
  if(d instanceof Date&&!isNaN(d))return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  if(typeof d==='number'){
    if(d>40000&&d<60000){const dt=new Date(Math.round((d-25569)*86400000));return dt.getFullYear()+'-'+(dt.getMonth()+1)+'-'+dt.getDate()}
    return String(d);
  }
  return String(d)
}

function renderPreview(){
  document.getElementById('data-card').style.display='block';
  const c=document.getElementById('data-preview');
  let h='<table class="data-table"><thead><tr><th>#</th><th>供应商公司名称</th><th>联系人</th><th>电话</th><th>地址</th><th>物料</th><th>日期</th></tr></thead><tbody>';
  suppliers.forEach((s,i)=>{h+=`<tr><td>${i+1}</td><td>${esc(s.companyName)}</td><td>${esc(s.contact)}</td><td>${esc(s.phone)}</td><td>${esc(s.address)}</td><td>${esc(s.material)}</td><td>${esc(s.date)}</td></tr>`});
  h+='</tbody></table>';c.innerHTML=h;
  document.getElementById('gen-card').style.display='block';
  document.getElementById('gen-summary').textContent=`共 ${suppliers.length} 家供应商，自动合并为一个文档（${suppliers.length*2}页），全部盖章`;
  const cl=document.getElementById('company-list-preview');let lh='<div class="company-list">';
  suppliers.forEach((s,i)=>{lh+=`<div class="company-item" id="gi-${i}"><div class="seal-preview-wrap">${sealSvg(s.companyName,50)}</div><div style="flex:1;min-width:0"><div class="company-name">${esc(s.companyName)}</div><div class="page-info">${esc(s.contact)} | ${esc(s.material)}</div></div><span class="status-badge status-pending" id="gs-${i}">待生成</span></div>`});
  lh+='</div>';cl.innerHTML=lh;
}

async function generateAll(){
  const btn=document.getElementById('gen-btn'),sp=document.getElementById('gen-spinner');
  btn.disabled=true;sp.style.display='inline-block';
  generatedFiles=[];
  showStatus('正在生成...','info');showProgress(5);
  if(!templateBuf){showStatus('❌ 模板未加载，请刷新重试','err');btn.disabled=false;sp.style.display='none';return}

  const cfg={
    partyA:document.getElementById('cfg-partyA').value.trim()||'宁海县中林橡塑有限公司',
    prefix:document.getElementById('cfg-prefix').value.trim()||'ZL-QF-0904',
    version:document.getElementById('cfg-version').value.trim()||'A/0',
    reviewers:[
      document.getElementById('cfg-r1').value.trim()||'董晓燕',
      document.getElementById('cfg-r2').value.trim()||'舒玛莉',
      document.getElementById('cfg-r3').value.trim()||'王明',
      document.getElementById('cfg-r4').value.trim()||'罗胜绪'
    ],
    manager:document.getElementById('cfg-manager').value.trim()||'贺永'
  };

  try{
    const blob=await buildMergedDoc(templateBuf,cfg,suppliers);
    generatedFiles.push({name:'供应商质量协议（全部'+suppliers.length+'家）.docx',blob});
    suppliers.forEach((_,i)=>{const el=document.getElementById('gs-'+i);if(el){el.textContent='✅';el.className='status-badge status-done';el.style.cssText=''}});
    showProgress(100);setTimeout(hideProgress,500);
    showStatus('✅ 已生成 '+suppliers.length+' 家供应商完整文档（'+suppliers.length*2+'页）','success');
    renderExport();
  }catch(err){console.error(err);showStatus('❌ '+err.message,'err');hideProgress()}
  btn.disabled=false;sp.style.display='none';
}
function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a}

// ═══════════════════════════════════════════════════════════════
// 构建合并文档
// ═══════════════════════════════════════════════════════════════
async function buildMergedDoc(tmplBuf,cfg,supplierList){
  const zip=await JSZip.loadAsync(tmplBuf.slice(0));

  // 确保 png content type
  let ct=await zip.file('[Content_Types].xml').async('string');
  if(!ct.includes('"png"')){ct=ct.replace('</Types>','<Default Extension="png" ContentType="image/png"/></Types>');zip.file('[Content_Types].xml',ct)}

  // 生成所有公章PNG
  const sealPromises=supplierList.map(s=>makeSealPng(s.companyName));
  const sealUrls=await Promise.all(sealPromises);
  for(let i=0;i<supplierList.length;i++){
    zip.file('word/media/seal_'+i+'.png',b64ToU8(sealUrls[i].replace('data:image/png;base64,','')));
  }

  // 添加所有 seal 的 rels
  let rels=await zip.file('word/_rels/document.xml.rels').async('string');
  for(let i=0;i<supplierList.length;i++){
    const rid='rIdSeal'+i;
    if(!rels.includes(rid)) rels=rels.replace('</Relationships>',`<Relationship Id="${rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/seal_${i}.png"/></Relationships>`);
  }

  // 读取原始 document.xml
  let docXml=await zip.file('word/document.xml').async('string');

  // 提取 body 内容（<w:body> 和 </w:body> 之间）
  const bodyOpenIdx=docXml.indexOf('<w:body>');
  const bodyCloseIdx=docXml.lastIndexOf('</w:body>');
  const beforeBody=docXml.substring(0,bodyOpenIdx+8);  // 包含 <w:body>

  // 提取纯 body 内容
  let bodyContent=docXml.substring(bodyOpenIdx+8, bodyCloseIdx);
  // 去掉 body 里的 sectPr
  bodyContent=bodyContent.replace(/<w:sectPr[\s\S]*?<\/w:sectPr>/g,'');
  // 移除模板中旧的公章图片
  bodyContent=bodyContent.replace(/<w:r>(?:(?!<w:r>)[\s\S])*?<w:drawing>(?:(?!<\/w:drawing>)[\s\S])*?rId9(?:(?!<\/w:drawing>)[\s\S])*?<\/w:drawing><\/w:r>/g,'');

  // 从原始XML提取sectPr，不做页边距修改（使用模板原始页边距）
  const sectPrOrig=docXml.match(/<w:sectPr[\s\S]*?<\/w:sectPr>/);
  const sectPr=sectPrOrig?sectPrOrig[0]:'';

  // 原始替换值
  const O={
    company:'宁波源合新材料科技有限公司',contact:'张子俊',material:'外箱',
    date:'2026-3-24',address:'宁波市奉化区西坞街道山下地村中横辽路2号1楼',
    phone:'15968915678',prefix:'ZL-QF-0904',version:'A/0',partyA:'宁海县中林橡塑有限公司'
  };
  const origReviewers=['董晓燕','舒玛莉','王明','罗胜绪','贺永'];
  const newReviewers=[...cfg.reviewers,cfg.manager];

  // 为每个供应商替换文本，然后拼在一起
  let allContent='';
  for(let i=0;i<supplierList.length;i++){
    const s=supplierList[i];
    let body=bodyContent;

    // 文本替换
    body=replaceInXmlText(body,O.company,s.companyName);
    body=replaceInXmlText(body,O.contact,s.contact);
    body=replaceInXmlText(body,O.material,s.material);
    body=replaceInXmlText(body,O.date,s.date);
    body=replaceInXmlText(body,O.address,s.address);
    body=replaceInXmlText(body,O.phone,s.phone);
    body=replaceInXmlText(body,O.prefix,cfg.prefix);
    body=replaceInXmlText(body,O.version,cfg.version);
    if(cfg.partyA!==O.partyA) body=replaceInXmlText(body,O.partyA,cfg.partyA);

    // 部门人员
    for(let ri=0;ri<Math.min(origReviewers.length,newReviewers.length);ri++){
      body=replaceInXmlText(body,origReviewers[ri],newReviewers[ri]);
    }

    // 评分 — 用 nthMatch 方法精确定位
    const sc1=randInt(55,65),sc2=randInt(7,9),sc3=randInt(6,9),sc4=randInt(5,9),total=sc1+sc2+sc3+sc4;
    // 63: 第1个出现 → score1
    body=replaceNthScore(body,'63',sc1,1);
    // 7: 第1个出现 → score2 (交期保证的评分)
    body=replaceNthScore(body,'7',sc2,1);
    // 10: 第3个出现 → score3 (价格评分)，前两个是 "(10%)" 里的
    body=replaceNthScore(body,'10',sc3,3);
    // 6: 第1个出现 → score4 (业务配合度)
    body=replaceNthScore(body,'6',sc4,1);
    // 86: 第1个出现 → 总分
    body=replaceNthScore(body,'86',total,1);

    // 公章
    const rid='rIdSeal'+i;
    body=injectSeal(body,s.companyName,rid);

    if(i>0) allContent+='<w:p><w:r><w:br w:type="page"/></w:r></w:p>';
    allContent+=body;
    showProgress(10+Math.round((i+1)/supplierList.length*85));
  }

  const finalDoc=beforeBody+allContent+sectPr+'</w:body></w:document>';
  zip.file('word/document.xml',finalDoc);
  zip.file('word/_rels/document.xml.rels',rels);

  // header
  try{
    let h1=await zip.file('word/header1.xml').async('string');
    h1=replaceInXmlText(h1,O.partyA,cfg.partyA);
    zip.file('word/header1.xml',h1);
  }catch(e){}

  return await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

// ═══════════════════════════════════════════════════════════════
// XML 文本替换（处理跨元素分割）
// ═══════════════════════════════════════════════════════════════
function replaceInXmlText(xml,oldVal,newVal){
  if(oldVal===newVal)return xml;
  // 策略1：直接字符串替换（适用于绝大多数情况）
  // oldVal 作为连续字符串出现在 XML 中（在 <w:t> 的文本内容里）
  if(xml.includes(oldVal)){
    return xml.split(oldVal).join(newVal);
  }
  // 策略2：oldVal 被分割在多个 <w:t> 元素中
  return replaceSplitText(xml,oldVal,newVal);
}

function replaceSplitText(xml,oldVal,newVal){
  // 匹配所有 <w:t> 元素，捕获开始标签、文本、结束标签
  const tPat=/<w:t(\s[^>]*)?>([^<]*)<\/w:t>/g;
  let m;const els=[];
  while((m=tPat.exec(xml))!==null){
    els.push({idx:m.index,full:m[0],open:m[1]||'',txt:m[2]});
  }
  for(let i=0;i<els.length;i++){
    let combined='',end=i;
    for(let j=i;j<els.length&&combined.length<oldVal.length;j++){
      combined+=els[j].txt;end=j;
      if(combined===oldVal){
        // 构建结果：在原文上分段拼接
        let result='';
        let cursor=0;
        for(let k=0;k<els.length;k++){
          // 跳过已被合并的元素
          if(k>i && k<=end) continue;
          // 复制从 cursor 到当前元素之前的内容
          result+=xml.substring(cursor,els[k].idx);
          if(k===i){
            // 第一个元素：替换文本
            result+='<w:t'+els[k].open+'>'+escXml(newVal)+'</w:t>';
          } else {
            // 其他元素：原样输出
            result+=els[k].full;
          }
          cursor=els[k].idx+els[k].full.length;
        }
        result+=xml.substring(cursor);
        return result;
      }
    }
  }
  return xml;
}

// 替换第 N 个 <w:t>val</w:t>
function replaceNthScore(xml,val,newScore,nth){
  const pat=new RegExp('<w:t([^>]*)>'+escRe(val)+'<\\/w:t>','g');
  let count=0;
  return xml.replace(pat,function(match,p1){
    count++;
    if(count===nth) return '<w:t'+p1+'>'+newScore+'</w:t>';
    return match;
  });
}

// ═══════════════════════════════════════════════════════════════
// 注入公章
// ═══════════════════════════════════════════════════════════════
function injectSeal(xmlStr,companyName,rid){
  const did=300+Math.floor(Math.random()*1000),pid=400+Math.floor(Math.random()*1000);
  // 公章尺寸 1.5cm x 1.5cm
  const CX=1500000,CY=1500000;
  const anc=`<w:r><w:rPr/><w:drawing>`+
    `<wp:anchor distT="0" distB="0" distL="0" distR="0" simplePos="0" relativeHeight="251658240" behindDoc="1" locked="0" layoutInCell="1" allowOverlap="1">`+
    `<wp:simplePos x="0" y="0"/>`+
    `<wp:positionH relativeFrom="character"><wp:posOffset>-600000</wp:posOffset></wp:positionH>`+
    `<wp:positionV relativeFrom="line"><wp:posOffset>-150000</wp:posOffset></wp:positionV>`+
    `<wp:extent cx="${CX}" cy="${CY}"/><wp:effectExtent l="0" t="0" r="0" b="0"/><wp:wrapNone/>`+
    `<wp:docPr id="${did}" name="seal${did}"/>`+
    `<wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr>`+
    `<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">`+
    `<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${pid}" name="Seal${pid}"/>`+
    `<pic:cNvPicPr><a:picLocks noChangeAspect="1"/></pic:cNvPicPr></pic:nvPicPr>`+
    `<pic:blipFill><a:blip r:embed="${rid}" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>`+
    `<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${CX}" cy="${CY}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>`+
    `</pic:pic></a:graphicData></a:graphic></wp:anchor></w:drawing></w:r>`;

  // 逐段落查找包含"乙方"和"供货商"和公司名的段落
  const pOpenRe=/<w:p[ >]/g;
  let pm;
  while((pm=pOpenRe.exec(xmlStr))!==null){
    const pStart=pm.index;
    const pEnd=xmlStr.indexOf('</w:p>',pStart);
    if(pEnd===-1) break;
    const para=xmlStr.substring(pStart,pEnd+6);
    const plain=para.replace(/<[^>]+>/g,'');
    if(plain.includes('乙方')&&plain.includes('供货商')&&plain.includes(companyName)){
      // 找包含"乙方"的 <w:t>，公章插在它后面（相对于固定文字定位，不随公司名长度变化）
      const tRe2=new RegExp('<w:t([^>]*)>[^<]*乙方[^<]*</w:t>','g');
      let tm2,targetIdx=-1,targetFull='';
      while((tm2=tRe2.exec(para))!==null){
        targetIdx=tm2.index;
        targetFull=tm2[0];
      }
      if(targetIdx!==-1){
        const insertPos=pStart+targetIdx+targetFull.length;
        return xmlStr.substring(0,insertPos)+anc+xmlStr.substring(insertPos);
      }
      // 后备：找最后一个含公司名的 <w:t>
      const tRe=new RegExp('<w:t[^>]*>[^<]*'+escRe(companyName)+'[^<]*</w:t>','g');
      let tm,lastIdx=-1,lastFull='';
      while((tm=tRe.exec(para))!==null){
        lastIdx=tm.index;
        lastFull=tm[0];
      }
      if(lastIdx!==-1){
        const insertPos=pStart+lastIdx+lastFull.length;
        return xmlStr.substring(0,insertPos)+anc+xmlStr.substring(insertPos);
      }
      // 后备：插在段落末尾 </w:p> 前
      return xmlStr.substring(0,pEnd)+anc+xmlStr.substring(pEnd);
    }
  }
  // 最终后备
  return xmlStr.replace('</w:body>',anc+'</w:body>');
}

// ═══════════════════════════════════════════════════════════════
// 公章生成 (Canvas)
// ═══════════════════════════════════════════════════════════════
function makeSealPng(name){
  const px=520;return new Promise(resolve=>{
    const canvas=document.createElement('canvas');canvas.width=px;canvas.height=px;
    const ctx=canvas.getContext('2d');ctx.clearRect(0,0,px,px);
    const cx=px/2,cy=px/2,outerR=250,textR=outerR-62,RED='#ff0000';
    ctx.strokeStyle=RED;ctx.fillStyle=RED;ctx.lineWidth=12;
    ctx.beginPath();ctx.arc(cx,cy,outerR,0,Math.PI*2);ctx.stroke();
    const sr=outerR*0.31,ir=sr*0.42;ctx.beginPath();
    for(let i=0;i<10;i++){const a=(i*Math.PI/5)-Math.PI/2,r=i%2===0?sr:ir;const x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
    ctx.closePath();ctx.fill();
    const chars=[...name],n=chars.length;
    const fontSize=85;
    const perCharDeg=21;
    const arcDeg=Math.min(320,n*perCharDeg),startDeg=-90-arcDeg/2;
    ctx.font=`bold ${fontSize}px SimSun,宋体,serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    chars.forEach((ch,i)=>{const deg=startDeg+(arcDeg/(n-1||1))*i;const rad=deg*Math.PI/180;const x=cx+textR*Math.cos(rad),y=cy+textR*Math.sin(rad);ctx.save();ctx.translate(x,y);ctx.rotate(rad+Math.PI/2);ctx.scale(0.82,1.25);ctx.fillText(ch,0,0);ctx.restore()});
    resolve(canvas.toDataURL('image/png'));
  });
}

function sealSvg(name,size){
  const cx=size/2,cy=size/2,outerR=size/2-1,textR=outerR-size*0.15;
  const chars=[...name],n=chars.length,fontSize=Math.round(size*0.16);
  const perCharDeg=21,arcDeg=Math.min(320,n*perCharDeg),startDeg=-90-arcDeg/2;
  let t=chars.map((ch,i)=>{const d=startDeg+(arcDeg/(n-1||1))*i,r=d*Math.PI/180,x=(cx+textR*Math.cos(r)).toFixed(2),y=(cy+textR*Math.sin(r)).toFixed(2);return`<text x="${x}" y="${y}" font-size="${fontSize}" fill="#ff0000" font-family="SimSun,宋体,serif" font-weight="bold" text-anchor="middle" dominant-baseline="central" transform="rotate(${(d+90).toFixed(1)},${x},${y})">${ch}</text>`}).join('');
  const sr=outerR*0.31,ir=sr*0.42;let pts=[];for(let i=0;i<10;i++){const a=(i*Math.PI/5)-Math.PI/2,r=i%2===0?sr:ir;pts.push(`${(cx+r*Math.cos(a)).toFixed(2)},${(cy+r*Math.sin(a)).toFixed(2)}`)}
  return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg"><circle cx="${cx}" cy="${cy}" r="${outerR}" fill="none" stroke="#ff0000" stroke-width="${Math.max(3,size*0.035).toFixed(1)}"/><polygon points="${pts.join(' ')}" fill="#ff0000"/>${t}</svg>`;
}

// ═══════════════════════════════════════════════════════════════
// 导出
// ═══════════════════════════════════════════════════════════════
function renderExport(){
  document.getElementById('export-card').style.display='block';
  const c=document.getElementById('export-list');
  c.innerHTML=`<div class="company-item"><div style="flex:1"><div class="company-name">${esc(generatedFiles[0].name)}</div><div class="page-info">共 ${suppliers.length} 家供应商 / ${suppliers.length*2} 页 / 已盖章</div></div></div>`;
}
function downloadAll(){
  if(!generatedFiles.length)return;
  generatedFiles.forEach(f=>{const url=URL.createObjectURL(f.blob);const a=document.createElement('a');a.href=url;a.download=f.name;a.click();URL.revokeObjectURL(url)});
  showStatus('✅ 已下载','success');
}

// ═══════════════════════════════════════════════════════════════
// 工具函数
// ═══════════════════════════════════════════════════════════════
function showStatus(msg,type){const el=document.getElementById('status-area');if(!msg){el.style.display='none';return}el.style.display='block';el.className='status-'+type;el.textContent=msg}
function showProgress(pct){document.getElementById('progress-bar').style.display='block';document.getElementById('progress-fill').style.width=pct+'%'}
function hideProgress(){document.getElementById('progress-bar').style.display='none';document.getElementById('progress-fill').style.width='0%'}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function escXml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function b64ToU8(b){const r=atob(b),a=new Uint8Array(r.length);for(let i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
